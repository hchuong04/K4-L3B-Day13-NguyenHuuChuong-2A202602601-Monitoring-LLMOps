alerts:
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 2m
    type: symptom-based
    channel: slack-#k4-l3b-alerts
    owner: student-2A202602601
    runbook: docs/alerts.md#alert-1
  - name: AnomalousCostSpike
    severity: warning
    condition: cost_usd_per_minute > 2.5
    duration: 2m
    type: symptom-based
    channel: slack-#k4-l3b-alerts
    owner: student-2A202602601
    runbook: docs/alerts.md#alert-2
  - name: LowQualityProxy
    severity: warning
    condition: quality_score_avg < 0.75
    duration: 5m
    type: symptom-based
    channel: slack-#k4-l3b-alerts
    owner: student-2A202602601
    runbook: docs/alerts.md#alert-3
